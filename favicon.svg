<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.2" result="b1"/>
      <feGaussianBlur stdDeviation="3" result="b2"/>
      <feGaussianBlur stdDeviation="6" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- clip the bust so the shoulders stop at the token ring -->
    <clipPath id="token"><circle cx="32" cy="32" r="19"/></clipPath>
  </defs>
  <rect width="64" height="64" fill="#000"/>
  <!-- EIDOLON: a round character token — ring + head-and-shoulders bust -->
  <g filter="url(#glow)" fill="none" stroke="#fcee0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="19"/>
    <g clip-path="url(#token)">
      <circle cx="32" cy="27" r="6.5"/>
      <path d="M17 52 Q17 38 32 38 Q47 38 47 52"/>
    </g>
  </g>
</svg>
